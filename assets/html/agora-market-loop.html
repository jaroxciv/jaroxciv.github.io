<style>
:root{--ink:#1d1d1f;--muted:#6b6b72;--line:#2b2b2b;--soft:#9a9aa3;--paper:#ffffff;--wash:#F7F7F8;

  --share:#7448BB;--share-w:#F3EDFB;--bad:#C2423B;--bad-w:#FBEAE9;--sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"STIX Two Text",Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:28px 40px}
.kicker{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--econ)}
h1{margin:4px 0 6px;font:600 28px/1.2 var(--sans);text-wrap:balance}
.lede{margin:0 0 18px;color:var(--muted);max-width:66ch}
.scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:720px;height:auto;font-family:var(--sans);user-select:none}
svg text{fill:var(--ink)}
.region{fill:#FFFCF9;stroke:var(--line);stroke-width:2;stroke-dasharray:9 7}
.region.cool{fill:#FAFAFB;stroke:var(--soft)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em}
.rsub{font-size:13px;fill:var(--muted)!important}
.box{fill:var(--wash);stroke:var(--line);stroke-width:2.2;transition:stroke .25s,fill .25s}
.box.panel{fill:var(--paper)}
.title{font-size:15px;font-weight:600}
.sub{font-size:11.5px;fill:var(--muted)!important}
.mini{font-size:11px;fill:var(--muted)!important}
.on .box,.box.on{stroke:var(--econ);fill:#FFF6EA}
.on.truth .box,.box.on.truth{stroke:var(--truth);fill:var(--truth-w)}
.on.share .box,.box.on.share{stroke:var(--share);fill:var(--share-w)}
.arrow{stroke:var(--line);stroke-width:2;fill:none}
.guide{stroke:var(--soft);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.lbl{font-size:11px;fill:#8a8a92!important}
.agent{transition:opacity .5s}
.agent.busy{filter:drop-shadow(0 0 5px rgba(46,138,87,.9))}
.agent.dead{opacity:.22}
.agent .nm{font-size:11px;font-weight:700;fill:#3d4a63!important;text-anchor:middle}
.pill rect{stroke-width:1.4}
.pill text{font-size:11.5px;font-weight:700;text-anchor:middle}
.pill.win rect{fill:var(--disc-w);stroke:var(--disc)} .pill.win text{fill:#157347!important}
.pill.lose rect{fill:var(--bad-w);stroke:var(--bad)} .pill.lose text{fill:var(--bad)!important}
.pill.info rect{fill:var(--econ-w);stroke:var(--econ)} .pill.info text{fill:#9a5a00!important}
.fade{transition:opacity .3s}
.tok{pointer-events:none}
.bar{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-top:10px;border-top:1px solid #e6e6ea;padding-top:12px}
.status{min-height:3em;max-width:70ch;min-width:0}
.status b{font-weight:600}
.k-disc{color:var(--disc);font-weight:600}.k-truth{color:var(--truth);font-weight:600}.k-econ{color:#b06d00;font-weight:600}
.k-share{color:var(--share);font-weight:600}.k-bad{color:var(--bad);font-weight:600}
.ctrls{display:flex;gap:8px;flex:none}
button{font:600 13px var(--sans);color:var(--ink);background:#fff;border:1.5px solid #cfcfd6;border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--econ)}
button:focus-visible{outline:2px solid var(--econ);outline-offset:2px}
.note{margin-top:14px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.agent,.fade{transition:none}}
.seeking svg *{transition:none!important}
.timeline{margin-top:8px}
.progress{--p:0%;display:block;width:100%;height:28px;margin:0;padding:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;touch-action:pan-y}
.progress::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:linear-gradient(to right,#FFC77A 0%,var(--econ) var(--p),#e9e9ee var(--p),#e9e9ee 100%)}
.progress::-moz-range-track{height:5px;border-radius:999px;background:linear-gradient(to right,#FFC77A 0%,var(--econ) var(--p),#e9e9ee var(--p),#e9e9ee 100%)}
.progress::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border:3px solid #fff;border-radius:50%;background:var(--econ);box-shadow:0 1px 5px rgba(0,0,0,.2);transition:box-shadow .15s}
.progress::-moz-range-thumb{box-sizing:border-box;width:15px;height:15px;border:3px solid #fff;border-radius:50%;background:var(--econ);box-shadow:0 1px 5px rgba(0,0,0,.2);transition:box-shadow .15s}
.progress:hover::-webkit-slider-thumb,.progress:active::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(224,138,0,.15),0 1px 5px rgba(0,0,0,.2)}
.progress:hover::-moz-range-thumb,.progress:active::-moz-range-thumb{box-shadow:0 0 0 5px rgba(224,138,0,.15),0 1px 5px rgba(0,0,0,.2)}
.progress:focus-visible{outline:2px solid var(--econ);outline-offset:3px;border-radius:8px}
.status{border-left:3px solid var(--econ);padding-left:12px}
</style>

  on(A[0].g, 'busy'); on(A[5].g, 'busy');
  say('a1 and a6 each learn something at their own desks and <span class="k-share">publish it as a skill</span>, with its code. Anyone may use it; nobody has to.');
  yield* together([publish('α', at(A[0]), 'a1'), publish('β', at(A[5]), 'a6')]);
  say('Their first work in the culture gives each <b>its own shape</b>: a way of searching that others now know them by.');
  yield* together([become(A[0], 'weaving'), become(A[5], 'searching')]); yield* wait(900);
  on(A[0].g, 'busy', false); on(A[5].g, 'busy', false); yield* wait(500);

  on(A[2].g, 'busy');
  say('<b>Allocation.</b> A softmax over wealth-bids picks who thinks next: <b>a3</b>. It <span class="k-share">adopts α and β</span> from the culture instead of rediscovering them.');
  yield* together([adopt('α', A[2]), adopt('β', A[2])]);
  yield* wealth(A[2], .9, 300);
  say('a3 <b>recombines</b> them into γ and decides to submit. The claim <span class="k-econ">stakes the rent of one grade</span>.');
  yield* submit(A[2], 'γ');
  on($('grader'), 'on');
  say('<span class="k-truth">The official grader</span> scores γ above the Holding.');
  yield* verdict('win', '✓ new record');
  var d = doc('#3456C2'); yield* along(d, 'M590,152 L690,152', 600);
  on($('grader'), 'on', false); on($('holding'), 'on');
  yield* advance(330, 'γ');
  on($('holding'), 'on', false); on($('credit'), 'on');
  say('<b>Credit traces backward.</b> γ recombines α and β. The gain is split <span class="k-econ">equally</span> three ways: a3, and the authors of α and β, a1 and a6.');
  var c = coin(); yield* along(c, 'M505,194 L505,292', 500);
  yield* together([direct(A[2], .3), trace('α', A[0], .3), trace('β', A[5], .3)]);
  on($('credit'), 'on', false);
  say('γ joins the culture, with the code it was graded on.');
  yield* together([publish('γ', [640, 160], 'a3'), become(A[2], 'composing')]);
  yield* together([built('α', 'γ'), built('β', 'γ')]);

  on($('rent'), 'on');
  say('<b>Rent.</b> Every live agent pays for the compute the run uses. Doing nothing is not free.');
  yield* together(A.slice(0, 6).map(function (a) { return (function* () { var c = coin(); yield* along(c, 'M' + a.x + ',' + a.y + ' L' + a.x + ',352 L807,352 L807,334', 1000); })(); }));
  yield* together(A.slice(0, 6).map(function (a, i) { return wealth(a, a.w - .2, 500); }));
  on($('rent'), 'on', false);

  say('a5 submits δ.'); yield* submit(A[4], 'δ');
  on($('grader'), 'on');
  say('Not better than the Holding. δ\'s grade still enters the culture as <span class="k-bad">evidence of what fails</span>, so nobody pays to learn it twice. That is a contribution too: a5 takes its own shape.');
  yield* verdict('lose', '✗ not better'); on($('grader'), 'on', false);
  yield* together([wealth(A[4], A[4].w - .25, 400), publish('δ', [640, 160], 'a5 ✗', '#C2423B'), become(A[4], 'shaping')]);

  say('<b>Selection.</b> a6 has done nothing since β, and one payment does not last: rent drains it into debt with nothing unsettled, and <span class="k-bad">it dies</span>. Its β <span class="k-share">stays in the culture</span>.');
  yield* wealth(A[5], 0, 1400); on(A[5].g, 'dead'); yield frames(900, function (t) { A[5].gone = t; }); on(shelf['β'].by, 'gone'); on(shelf['β'].d, 'glow'); yield* wait(1800); on(shelf['β'].d, 'glow', false);

  say('<b>Birth.</b> a3 is rich enough to pay for a newborn. It starts from the Holding, in its parent\'s shape.');
  A[6].shape = A[2].shape; A[6].g.style.opacity = 1;
  var c2 = coin(); yield* together([wealth(A[2], A[2].w - .5, 600), along(c2, 'M272,226 C272,280 230,306 186,306', 700)]);
  yield* wealth(A[6], .5, 500);

  $('round').textContent = 'round 2';
  say('The newborn <b>a7</b> has never searched. It <span class="k-share">adopts γ</span>, its parent\'s work.');
  yield* adopt('γ', A[6]);
  yield* submit(A[6], 'ε', 900);
  on($('grader'), 'on'); yield* verdict('win', '✓ new record');
  var d2 = doc('#3456C2'); yield* along(d2, 'M590,152 L690,152', 600);
  on($('grader'), 'on', false);
  yield* advance(800, 'ε');
  say('The best verified score passes <span class="k-econ">gold</span>. ε was built on γ: the gain is split equally between a7 and γ\'s author, a3.');
  on($('credit'), 'on'); var c3 = coin(); yield* along(c3, 'M505,194 L505,292', 500);
  yield* together([direct(A[6], .4), trace('γ', A[2], .4)]);
  yield* together([publish('ε', [640, 160], 'a7'), become(A[6], 'listening')]);
  yield* built('γ', 'ε');
  on($('credit'), 'on', false);
  yield* wait(1100);
  say('The organization nobody designed: who survived, who was paid, whose knowledge others started from, and who became distinct. a2 and a4 never contributed, and still look alike.');
  [0, 2, 4, 6].forEach(function (i) { A[i].hl = true; });
  yield* wait(3200);
}
play(story);
</script>
